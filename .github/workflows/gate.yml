# The merge condition, run by a machine instead of by memory.
#
# `npm run gate` is typecheck, production build, lint (source and stylesheet)
# and the tests, including the headless Chrome sweeps. It never skips.
#
# There are no required status checks on `main`: Tom pushes to main directly
# and a required check would block him. This workflow is therefore advisory on
# a push and blocking only by a human reading it. The one place a gate is a
# hard stop is the `publish` job in release-please.yml, which runs the same
# `npm run gate` at the exact commit it is about to release.
#
# workflow_dispatch is here on purpose and is not a convenience. A pull request
# opened by GITHUB_TOKEN does not trigger other workflows, so the release-please
# pull request gets no automatic run and has to be dispatched onto its head
# commit. See the note in .github/workflows/release-please.yml.

name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: versions.json is append-only
        # An earlier release is still installed in somebody's vault and its
        # floor must not move. A hand-edit overwrote the 0.14.0 key once.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit for this event (a dispatch, or a new branch). Nothing to compare."
            exit 0
          fi
          git fetch --depth=1 origin "$BASE"
          git show "$BASE:versions.json" > /tmp/base-versions.json
          jq -en \
            --slurpfile b /tmp/base-versions.json \
            --slurpfile n versions.json \
            '$b[0] | to_entries | all(.[]; $n[0][.key] == .value)' \
            || { echo "versions.json changed or removed an earlier key. The map is append-only."; exit 1; }
          echo "Every key present at $BASE is unchanged."

      - name: The three version fields agree
        # package.json, manifest.json and release-please's own bookmark are the
        # same number, or the next release computes from the wrong base.
        # package-lock.json is deliberately not asserted here: main carries a
        # known lock drift that the next release pull request repairs.
        run: |
          set -euo pipefail
          package_version="$(jq -r '.version' package.json)"
          manifest_version="$(jq -r '.version' manifest.json)"
          seed_version="$(jq -r '.["."]' .release-please-manifest.json)"
          echo "package=$package_version manifest=$manifest_version release-please-seed=$seed_version"
          [ "$package_version" = "$manifest_version" ]
          [ "$package_version" = "$seed_version" ]

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Prove a real Chrome exists before the gate needs it
        # test/dom/chrome.mjs fails rather than skips when Chrome is missing.
        # Failing here instead names the cause in one line at the top of the log.
        run: |
          set -euo pipefail
          if [ ! -x "$CHROME_BIN" ]; then
            echo "No Chrome at $CHROME_BIN. The computed-style sweeps cannot run."
            echo "Point CHROME_BIN at a Chrome or Chromium binary on the runner."
            exit 1
          fi
          "$CHROME_BIN" --version

      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Run the gate
        run: npm run gate
