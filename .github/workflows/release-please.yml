# The release pull request is the only thing that touches a version field, and
# it is the only pull request in this repository. Everything else is pushed to
# main directly.
#
# Three jobs, in order:
#   1. release-please  opens or grooms the release pull request from the
#      Conventional Commits on main, and on merge creates a DRAFT release.
#   2. versions-json   appends this release's key to versions.json on the
#      release pull request branch. release-please has no native updater for
#      the Obsidian versions map and JSON cannot carry a marker comment, so a
#      script step is the honest route rather than a `generic` updater.
#   3. publish         runs the full gate at the released commit, uploads the
#      three assets to the draft, and only then publishes it.
#
# The release is created as a draft on purpose. A draft has no git tag, so
# nothing is public and nothing is tagged until the gate has passed and all
# three assets are attached. `publish` therefore checks out the release SHA,
# not the tag: the tag does not exist yet.
#
# GITHUB_TOKEN only. No personal access token, no new secret.
#
# KNOWN LIMITATION, stated rather than papered over: a pull request opened by
# GITHUB_TOKEN does not trigger other workflows. The release pull request will
# therefore NOT get an automatic `gate` run. There are no required status
# checks on main, so this blocks nothing, but the release pull request should
# still be gated before it is merged:
#
#   gh workflow run gate.yml --ref "$(gh pr view <number> --json headRefName -q .headRefName)"
#
# The same limitation applies to the versions-json commit below: it is pushed
# with GITHUB_TOKEN, so it triggers nothing either. Dispatch the gate AFTER
# that commit has landed, so the check sits on the final head commit.

name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr_branch: ${{ steps.release.outputs.prs_created == 'true' && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
    steps:
      - name: Open or groom the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  versions-json:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Append the versions.json key for this release
        run: node .github/scripts/append-versions-json.mjs

      - name: Commit it to the release pull request branch
        env:
          BRANCH: ${{ needs.release-please.outputs.pr_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- versions.json; then
            echo "versions.json is already correct on this branch. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore(release): append the versions.json key for this release"
          git push origin "HEAD:$BRANCH"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Check out the released COMMIT, never a branch
        # The assets must come from the released tree. An asset built from any
        # other tree does not match what the Obsidian directory rebuilds. The
        # release is still a draft at this point, so its tag does not exist
        # yet and the SHA is the only thing that can be checked out.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Prove the checked-out tree is the one being released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version="$(jq -r '.version' manifest.json)"
          package_version="$(jq -r '.version' package.json)"
          lock_version="$(jq -r '.version' package-lock.json)"
          lock_root_version="$(jq -r '.packages[""].version' package-lock.json)"
          seed_version="$(jq -r '.["."]' .release-please-manifest.json)"
          min_app="$(jq -r '.minAppVersion' manifest.json)"
          mapped="$(jq -r --arg v "$VERSION" '.[$v] // "MISSING"' versions.json)"
          head_sha="$(git rev-parse HEAD)"
          target="$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)"
          echo "tag=$TAG version=$VERSION manifest=$manifest_version package=$package_version lock=$lock_version lock_root=$lock_root_version seed=$seed_version versions[$VERSION]=$mapped minAppVersion=$min_app"
          echo "head=$head_sha release target=$target"
          [ "$TAG" = "$VERSION" ]
          [ "$manifest_version" = "$VERSION" ]
          [ "$package_version" = "$VERSION" ]
          [ "$lock_version" = "$VERSION" ]
          [ "$lock_root_version" = "$VERSION" ]
          [ "$mapped" = "$min_app" ]
          [ "$seed_version" = "$VERSION" ]
          [ "$target" = "$head_sha" ]

      - name: Prove a real Chrome exists before the gate needs it
        run: |
          set -euo pipefail
          if [ ! -x "$CHROME_BIN" ]; then
            echo "No Chrome at $CHROME_BIN. The computed-style sweeps cannot run."
            echo "Point CHROME_BIN at a Chrome or Chromium binary on the runner."
            exit 1
          fi
          "$CHROME_BIN" --version

      - name: Install exactly what the lockfile says
        run: npm ci

      - name: Run the gate at the released commit
        # This is the hard stop. Pushes go straight to main and there are no
        # required status checks, so this is the last place anything can say no
        # before the release becomes public. `npm run gate` includes the
        # production build, so it also produces main.js.
        run: npm run gate

      - name: Title the release the way every earlier one is titled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: gh release edit "$TAG" --title "ICOR for Life - AI Chat $VERSION"

      - name: Upload the three assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        # No --clobber on purpose. If an asset is already on the release,
        # something uploaded it from a tree nobody checked, and that is the
        # failure this workflow exists to prevent. Let it fail and be looked at.
        #
        # Recovery after a partial upload (one or two assets landed, then the
        # step failed): the release is still a draft and nothing is public.
        # Delete the assets that did land, then re-run the job.
        #   gh release delete-asset "$TAG" main.js -y
        #   gh release delete-asset "$TAG" manifest.json -y
        #   gh release delete-asset "$TAG" styles.css -y
        run: gh release upload "$TAG" main.js manifest.json styles.css

      - name: Publish the draft, which is what creates the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --latest
